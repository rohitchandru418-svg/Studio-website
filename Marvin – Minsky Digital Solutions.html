<script>
(function(){
var $=function(s){return document.querySelector(s)};
var scr=$('#screen'),vw=innerWidth,vh=innerHeight;
var LINES=[["Hi","there!"],["I'm","Interactive","Marvin","assistant,"],["Welcome","to","Minsky","Digital","Solutions."]];
var SPEAK="Hi there! I'm Interactive Marvin assistant, Welcome to Minsky Digital Solutions.";
var ALL=[
["Care for the end-users","p","Marvin's eyes always point at you. The whole screen is built around the viewer's attention.","Every screen starts from what real users look at, want and struggle with."],
["Human-centric approach","p","A machine face that blinks, sleeps and reacts like a living thing. Technology with human manners.","Software that adapts to people's habits and never makes them learn the machine."],
["User empathy","p","The pupils narrow when you come close, widen when you move fast, and the eyes close when you leave. Marvin reads signals before you speak.","We interview, observe and test with users, so we solve their real problem."],

["Scalability","c","The same grid redraws on a phone or a wide monitor, so one set of rules fits every size.","Architecture that grows from 100 to a million users without a rewrite."],
["Reliability","c","Marvin is always on and answers every movement instantly. If the voice is blocked, he still reads in text.","Monitored, load-tested systems with graceful fallbacks when something fails."],
["Secure architecture","c","Marvin only looks at the cursor inside this page. Nothing is recorded, tracked or sent anywhere.","Security by design: least privilege, encryption, reviewed dependencies."],
["End-to-end solutions","b","One continuous journey: Marvin wakes, greets, reads, shows work and leads you to Start a Project.","Strategy, design, build, launch and care from one accountable team."],
["Web design","b","One colour, one pixel font, one memorable character. You recognise the brand in two seconds.","Distinct, fast, accessible design that works on every screen."],
["Full-stack development","b","Two eyes make depth: the front-end (animation, voice) and the back-end (data, AI, infrastructure) must see one picture together.","One team owns every layer, so nothing is lost between handovers."],
["AI-native applications","b","Binary digits flicker inside the eyes. The assistant is the interface itself, not a chatbot bolted to the corner.","AI designed into the core workflow from day one, with humans in control."],
["Open-source technologies","b","Plain text characters and open web standards. Nothing proprietary, so anyone can inspect, copy and extend it.","Transparent, community-vetted tools with no vendor lock-in."]];
var GN={p:"The people we build for",c:"The craft that keeps it standing",b:"What we deliver"};

/* ---------- ASCII eyes ---------- */
var cv=$('#cv'),ctx=cv.getContext('2d'),COLS=46,ROWS=22,GAP=6,cw=6,ch=9,asp=.6,dpr=1;
function layout(){
 var sw=scr.clientWidth;dpr=Math.min(2,devicePixelRatio||1);ctx.font='100px VT323,monospace';var ratio=ctx.measureText('M').width/100;
 var W=Math.min(sw*(sw<640?.84:.46),500),fs=Math.min(17,W/((COLS*2+GAP)*ratio));cw=fs*ratio;ch=fs*.78;asp=cw/ch;
 var w=cw*(COLS*2+GAP),h=ch*ROWS;cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*dpr;cv.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.font=fs+'px VT323,monospace';ctx.textAlign='center';ctx.textBaseline='middle'}
addEventListener('resize',function(){vw=innerWidth;vh=innerHeight;layout()});
layout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);

var mx=vw/2,my=vh/2,tgt=null,o=0,oT=0,pr=1,boot=0,powered=false,sleeping=false,lastMove=Date.now(),lastX=0,lastY=0,reading=false;
var E=[{ix:0,iy:0},{ix:0,iy:0}];

function nextBlink(){setTimeout(function(){if(powered&&!sleeping)blink();nextBlink()},2600+Math.random()*3400)}
function wake(){sleeping=false;oT=.4;setTimeout(function(){oT=0},500);setTimeout(function(){oT=.7},800);setTimeout(function(){oT=0},1050);setTimeout(function(){oT=1},1250)}
function hash(a,b,c){var h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)%1000/1000}
function frame(t){
 var r=cv.getBoundingClientRect(),p;
 if(tgt){var q=tgt.getBoundingClientRect();p=[q.left+q.width/2,q.top+q.height/2,.3]}else p=[mx,my,.45];
 if(powered)boot=Math.min(1,boot+.02);
 o+=(oT-o)*(oT<o?.4:.2);
 ctx.clearRect(0,0,cv.width,cv.height);
 var last='';
 for(var e=0;e<2;e++){
  var ox=e*(COLS+GAP),cx=r.left+(ox+COLS/2)*cw,cy=r.top+ROWS*ch/2;
  var nx=Math.max(-1,Math.min(1,(p[0]-cx)/(vw*p[2]))),ny=Math.max(-1,Math.min(1,(p[1]-cy)/(vh*p[2])));
  if(sleeping){nx=0;ny=.5}
  var d=Math.hypot(mx-cx,my-cy),pt=sleeping?.7:(d<240&&!tgt?.6+.4*d/240:1);
  E[e].ix+=(nx-E[e].ix)*.15;E[e].iy+=(ny-E[e].iy)*.15;
  var a=COLS/2*asp-.2,b=ROWS/2-.3,bo=b*Math.max(o,.001),ri=Math.min(a,b)*.62,rp=ri*.46*pr*pt;
  var ixp=E[e].ix*(a-ri)*.8,iyp=E[e].iy*b*.28;
  if(o<.12){ctx.fillStyle='#46ffb8';for(var c=4;c<COLS-4;c++){var u=(c+.5-COLS/2)/(COLS/2),row=Math.round(ROWS/2+2.5*(1-u*u));if(hash(c,e,9)<boot)ctx.fillText('=',(ox+c+.5)*cw,(row+.5)*ch)}continue}
  for(var rr=0;rr<ROWS;rr++)for(var c2=0;c2<COLS;c2++){
   var x=(c2+.5-COLS/2)*asp,y=rr+.5-ROWS/2,v=Math.pow(Math.abs(x)/a,2)+Math.pow(Math.abs(y)/bo,2);
   if(v>1||hash(rr,c2,e)>boot)continue;
   var s,col,dx=x-ixp,dy=y-iyp,dd=Math.hypot(dx,dy),hh=hash(rr,c2,3);
   if(v>.8){s='#';col='#9dffdf'}
   else if(dd<rp)continue;
   else if(Math.hypot(dx+ri*.4,dy+ri*.4)<ri*.15){s='*';col='#fff'}
   else if(Math.hypot(dx-ri*.35,dy-ri*.4)<ri*.08){s='+';col='#fff'}
   else if(dd<ri){var f=dd/ri,an=Math.atan2(dy,dx);
    if(f>.86){s='@';col='#46ffb8'}
    else if(f>.5){var sn=Math.sin(an*16+f*3);s=sn>.35?'%':sn>-.35?'&':'8';col=sn>0?'#2fe0a0':'#1aa87a'}
    else{s=hh<.5?'+':'*';col='#ffb000'}}
   else{s=hh<.46?'0':hh<.92?'1':':';col=hash(rr,c2,Math.floor(t/420)+e)<.5?'#16a273':'#12875f'}
   if(col!==last){ctx.fillStyle=col;last=col}
   ctx.fillText(s,(ox+c2+.5)*cw,(rr+.5)*ch)}}
 pr+=(1-pr)*.1;
 if(powered&&!sleeping&&Date.now()-lastMove>7500&&!reading){sleeping=true;oT=0}
 requestAnimationFrame(frame)}
setInterval(function(){if(!sleeping)return;var s=document.createElement('span');s.textContent=['z','Z','Zz'][Math.floor(Math.random()*3)];s.style.fontSize=(18+Math.random()*14)+'px';s.style.left=Math.random()*20+'px';$('#zzz').appendChild(s);setTimeout(function(){s.remove()},3300)},1100);

/* ---------- works pop on cursor movement ---------- */
var WORKS=[["lumen_health.exe","Patient portal","#46ffb8"],["orbit_pay.exe","Fintech dashboard","#ffb000"],["kaveri_farms.exe","Marketplace app","#ff6bd6"],["aster_ai.exe","Support copilot","#6bc7ff"],["tidewise.exe","Logistics tracker","#c4ff4d"],["greenleaf.exe","Carbon reporting","#ff7a5c"]];
var wi=0,worksOn=false,panelOpen=false,lastWork=0,acc=0;
function rel(el,s){var r=el.getBoundingClientRect();return{left:r.left-s.left,right:r.right-s.left,top:r.top-s.top,bottom:r.bottom-s.top}}
function hit(x,y,w,h,r){return x<r.right+12&&x+w>r.left-12&&y<r.bottom+12&&y+h>r.top-12}
function popWork(force){
 if(!force&&document.querySelectorAll('.work').length>=5)return;
 var d=WORKS[wi++%WORKS.length],el=document.createElement('div');el.className='work';el.style.setProperty('--c',d[2]);
 el.innerHTML='<i>'+d[0]+'</i><div></div><p>'+d[1]+'</p>';
 var s=scr.getBoundingClientRect(),w=Math.min(180,Math.max(120,s.width*.15)),h=w*.78,x,y,n=0,R=[rel($('#eyeWrap'),s),rel($('#msg'),s),rel($('#after'),s),{left:s.width-200,right:s.width,top:0,bottom:150}];
 do{x=24+Math.random()*(s.width-w-48);y=24+Math.random()*(s.height-h-48);n++}while(n<40&&R.some(function(r){return hit(x,y,w,h,r)}));
 el.style.left=x+'px';el.style.top=y+'px';el.style.transform='rotate('+(Math.random()*10-5)+'deg)';scr.appendChild(el);setTimeout(function(){el.remove()},3100)}
addEventListener('pointermove',function(e){
 var sp=Math.hypot(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY;mx=e.clientX;my=e.clientY;

 if(worksOn&&!panelOpen){acc+=sp;if(acc>110&&Date.now()-lastWork>650){acc=0;lastWork=Date.now();popWork()}}});
addEventListener('pointerdown',function(e){mx=e.clientX;my=e.clientY;lastMove=Date.now();if(powered){if(sleeping)wake();else{blink();pr=.5}}});
addEventListener('keydown',function(e){lastMove=Date.now();if(powered&&sleeping)wake();if(e.key==='Escape')closePanel()});
addEventListener('dblclick',function(){oT=.15;setTimeout(function(){oT=1},500)});

/* ---------- reading (voice + word reveal) ---------- */
var msg=$('#msg'),words=[],offs=[],timers=[],done=false;
(function(){var pos=0;LINES.forEach(function(l,li){var d=document.createElement('div');d.className=li?'l2':'l1';l.forEach(function(w){var s=document.createElement('span');s.className='w';s.textContent=w;d.appendChild(s);words.push(s);var i=SPEAK.indexOf(w,pos);offs.push(i);pos=i+w.length});msg.appendChild(d)})})();
function setWord(i){words.forEach(function(w,k){w.classList.toggle('on',k<i);w.classList.toggle('now',k===i)});tgt=words[i]||null}
function clearT(){timers.forEach(clearTimeout);timers=[]}
function finish(){if(done)return;done=true;reading=false;clearT();words.forEach(function(w){w.classList.remove('now');w.classList.add('on')});tgt=null;blink();
 setTimeout(function(){$('#after').classList.add('show');tgt=$('#mail');setTimeout(function(){tgt=null},1400)},300);
 setTimeout(function(){worksOn=true;popWork();setTimeout(popWork,700)},1800)}
function timedRun(total){clearT();var tw=0;words.forEach(function(w){tw+=w.textContent.length+2});var t=0;
 words.forEach(function(w,i){var at=t;timers.push(setTimeout(function(){setWord(i)},at));t+=(w.textContent.length+2)/tw*total});
 timers.push(setTimeout(finish,total+500))}
function read(){reading=true;setWord(-1);var est=SPEAK.length*78,heard=false;
 if(!window.speechSynthesis){timedRun(est);return}
 speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(SPEAK);u.rate=.9;u.pitch=.55;u.volume=1;
 var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang)})[0];if(v)u.voice=v;
 u.onstart=function(){clearT();timedRun(est);timers.push(setTimeout(finish,est+4000))};
 u.onboundary=function(e){if(e.name&&e.name!=='word')return;if(!heard){heard=true;clearT();timers.push(setTimeout(finish,est+4000))}var k=0;for(var i=0;i<offs.length;i++)if(offs[i]<=e.charIndex)k=i;setWord(k)};
 u.onend=function(){finish()};u.onerror=function(){if(!done)timedRun(est)};

 timers.push(setTimeout(function(){timedRun(est)},1500))}

/* ---------- panel / menu ---------- */
var panel=$('#panel'),card=$('#card');
function chips(g){return '<div class="g">'+GN[g]+'</div><div class="chips">'+ALL.map(function(a,i){return a[1]===g?'<button class="chip" data-i="'+i+'">'+a[0]+'</button>':''}).join('')+'</div>'}

 else h+='<h2>Services</h2><p class="lead">One team that designs, builds and looks after your product from idea to long-term care.</p>'+chips('b');
 h+='<div id="why"><b>Pick a trait.</b><br>Each one is shown in how Marvin behaves.</div>';card.innerHTML=h;panel.classList.add('show');panelOpen=true;
